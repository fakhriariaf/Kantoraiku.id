<h2>Masuk ke kantor kamu</h2>
<p>Klik link di bawah untuk masuk ke Kantoraiku tanpa password.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/kantor-saya">Masuk sekarang</a></p>
<p>Link ini berlaku 1 jam dan hanya bisa dipakai sekali. Kalau kamu tidak memintanya, abaikan email ini.</p>
