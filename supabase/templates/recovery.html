<h2>Atur password kantor kamu</h2>
<p>Seseorang (semoga kamu) meminta untuk mengatur password akun Kantoraiku dengan email ini.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/atur-password">Atur password</a></p>
